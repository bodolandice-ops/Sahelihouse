<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Quest - Master Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #1a1a1a; --accent: #00ccff; --danger: #ff4444; }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0; padding: 0; font-family: -apple-system, sans-serif; 
            background: var(--bg); color: white; 
            display: flex; flex-direction: column; 
            height: 100vh; height: -webkit-fill-available;
            overflow: hidden; 
        }

        /* Top Section: Camera Area */
        #video-container { 
            position: relative; 
            flex: 1; 
            overflow: hidden; 
            background: #000;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }

        #reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 180px; height: 180px; border: 2px dashed rgba(0,255,136,0.4); border-radius: 20px;
            z-index: 2; pointer-events: none;
        }

        .name-overlay {
            position: absolute; top: 15px; width: 100%; text-align: center; z-index: 5;
        }
        #playerName {
            padding: 12px 15px; border-radius: 25px; border: 1px solid var(--primary);
            background: rgba(0,0,0,0.8); color: white; width: 70%; text-align: center; font-size: 16px;
        }

        /* Bottom Section: Queue/History */
        #history-section { 
            height: 40vh; 
            background: #111; 
            display: flex; 
            flex-direction: column; 
            border-top: 3px solid var(--primary);
            z-index: 10;
        }

        #history-header { 
            padding: 12px 15px; background: #222; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333;
        }

        .sync-btn {
            background: var(--primary); color: #000; border: none; padding: 10px 18px;
            border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer;
        }
        .sync-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        #history-list { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }

        .queue-item { 
            background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--accent); animation: slideIn 0.2s ease-out;
        }
        .item-data { font-size: 14px; font-weight: bold; color: #fff; word-break: break-all; margin-right: 10px; }
        .remove-btn { color: var(--danger); background: none; border: none; font-size: 22px; font-weight: bold; padding: 0 10px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Confirmation Modal */
        #confirm-modal {
            position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: #222; padding: 25px; border-radius: 20px; border: 2px solid var(--primary);
            text-align: center; opacity: 0; visibility: hidden; transition: 0.2s; z-index: 100;
            width: 85%; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        #confirm-modal.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .modal-btn { background: var(--primary); color: black; border: none; padding: 15px; width: 100%; border-radius: 30px; font-weight: bold; margin-top: 15px; font-size: 16px; }
        .cancel-btn { background: transparent; color: #999; border: none; margin-top: 10px; width: 100%; font-size: 14px; }
        
        #clearBtn { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; border-radius: 4px; font-size: 10px; margin-left: 10px; }
    </style>
</head>
<body>

    <div id="video-container">
        <div class="name-overlay">
            <input type="text" id="playerName" placeholder="Enter Nickname">
        </div>
        <video id="video" playsinline></video>
        <div id="reticle"></div>
    </div>

    <div id="history-section">
        <div id="history-header">
            <div style="display: flex; align-items: center;">
                <span style="font-size: 12px; color: var(--primary); font-weight: bold;">QUEUE: <span id="item-count">0</span></span>
                <button id="clearBtn">CLEAR ALL</button>
            </div>
            <button id="syncAllBtn" class="sync-btn" disabled>SYNC TO SHEET</button>
        </div>
        <div id="history-list">
            <div id="empty-msg" style="text-align: center; color: #555; margin-top: 20px; font-size: 14px;">Scan QR codes to build your list...</div>
            <div id="item-list"></div>
        </div>
    </div>

    <div id="confirm-modal">
        <div style="font-size: 12px; color: var(--primary); margin-bottom: 5px; letter-spacing: 1px;">QR DETECTED</div>
        <div id="modal-data" style="font-weight: bold; font-size: 18px; margin-bottom: 10px; color: white; word-break: break-all;">---</div>
        <button id="addBtn" class="modal-btn">ADD TO QUEUE</button>
        <button id="discardBtn" class="cancel-btn">Discard Scan</button>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const modal = document.getElementById("confirm-modal");
        const modalData = document.getElementById("modal-data");
        const itemList = document.getElementById("item-list");
        const itemCountDisplay = document.getElementById("item-count");
        const syncBtn = document.getElementById("syncAllBtn");
        const emptyMsg = document.getElementById("empty-msg");
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1DwYlilwRXSnMZliY1lPXv9FYR8rOPO_c3-aV10Yf8lEwxukry7AlOrBiDfXUBCX_bA/exec";

        let scanQueue = [];
        let isScanning = true;
        let pendingData = "";

        // Audio Setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // Camera Init
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream; video.play(); requestAnimationFrame(tick);
        });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
                canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code) {
                    isScanning = false;
                    pendingData = code.data;
                    modalData.innerText = code.data;
                    modal.classList.add("show");
                    playSound(880, 0.1); // Detection beep
                }
            }
            requestAnimationFrame(tick);
        }

        // Modal Controls
        document.getElementById("addBtn").onclick = () => {
            scanQueue.push(pendingData);
            updateUI();
            closeModal();
        };

        document.getElementById("discardBtn").onclick = closeModal;

        function closeModal() {
            modal.classList.remove("show");
            isScanning = true;
            pendingData = "";
        }

        // UI Management
        function updateUI() {
            itemCountDisplay.innerText = scanQueue.length;
            syncBtn.disabled = scanQueue.length === 0;
            emptyMsg.style.display = scanQueue.length ? "none" : "block";
            
            itemList.innerHTML = "";
            scanQueue.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "queue-item";
                div.innerHTML = `
                    <span class="item-data">${item}</span>
                    <button class="remove-btn" onclick="removeItem(${index})">×</button>
                `;
                itemList.prepend(div);
            });
        }

        window.removeItem = (index) => {
            scanQueue.splice(index, 1);
            updateUI();
        };

        document.getElementById("clearBtn").onclick = () => {
            if(confirm("Empty your queue?")) {
                scanQueue = []; updateUI();
            }
        };

        // Final Cloud Sync
        syncBtn.onclick = async () => {
            const name = document.getElementById("playerName").value || "Anonymous";
            syncBtn.innerText = "SYNCING...";
            syncBtn.disabled = true;

            for (const data of scanQueue) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: 'no-cors',
                        body: JSON.stringify({ qrData: data, playerName: name })
                    });
                } catch (e) { console.error("Sync Error", e); }
            }

            playSound(1200, 0.3); // Success chime
            alert("All items sent to Google Sheet!");
            scanQueue = [];
            syncBtn.innerText = "SYNC TO SHEET";
            updateUI();
        };
    </script>
</body>
</html>
