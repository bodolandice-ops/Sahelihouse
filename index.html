<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Quest - Identity Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #1a1a1a; --accent: #00ccff; --danger: #ff4444; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; font-family: -apple-system, sans-serif; 
            background: var(--bg); color: white; display: flex; flex-direction: column; 
            height: 100vh; height: -webkit-fill-available; overflow: hidden; 
        }

        /* Camera Area */
        #video-container { position: relative; flex: 1; overflow: hidden; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 160px; height: 160px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 20px;
        }

        /* Identity Overlay */
        .identity-overlay {
            position: absolute; top: 10px; width: 100%; display: flex; flex-direction: column;
            align-items: center; gap: 8px; z-index: 5;
        }
        .id-input {
            padding: 10px 15px; border-radius: 20px; border: 1px solid var(--primary);
            background: rgba(0,0,0,0.85); color: white; width: 85%; text-align: center; font-size: 14px;
        }

        /* Bottom Section */
        #history-section { 
            height: 40vh; background: #111; display: flex; flex-direction: column; 
            border-top: 3px solid var(--primary); z-index: 10;
        }
        #history-header { padding: 12px 15px; background: #222; display: flex; justify-content: space-between; align-items: center; }
        
        .sync-btn {
            background: var(--primary); color: #000; border: none; padding: 10px 18px;
            border-radius: 20px; font-weight: bold; font-size: 13px;
        }
        .sync-btn:disabled { background: #333; color: #666; }

        #history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .queue-item { 
            background: var(--card); padding: 10px; border-radius: 8px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent);
        }
        .remove-btn { color: var(--danger); background: none; border: none; font-size: 22px; font-weight: bold; }

        /* Modal */
        #confirm-modal {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: #222; padding: 25px; border-radius: 20px; border: 2px solid var(--primary);
            text-align: center; opacity: 0; visibility: hidden; transition: 0.2s; z-index: 100; width: 85%;
        }
        #confirm-modal.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .modal-btn { background: var(--primary); color: black; border: none; padding: 15px; width: 100%; border-radius: 30px; font-weight: bold; margin-top: 15px; }
        .cancel-btn { background: transparent; color: #999; border: none; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div id="video-container">
        <div class="identity-overlay">
            <input type="text" id="userName" class="id-input" placeholder="Full Name">
            <input type="tel" id="userPhone" class="id-input" placeholder="Phone Number">
        </div>
        <video id="video" playsinline></video>
        <div id="reticle"></div>
    </div>

    <div id="history-section">
        <div id="history-header">
            <span style="font-size: 11px; color: var(--primary);">QUEUED: <span id="item-count">0</span></span>
            <button id="syncAllBtn" class="sync-btn" disabled>CONFIRM & SYNC</button>
        </div>
        <div id="history-list"><div id="item-list"></div></div>
    </div>

    <div id="confirm-modal">
        <div style="font-size: 11px; color: var(--primary); margin-bottom: 5px;">QR FOUND</div>
        <div id="modal-data" style="font-weight: bold; font-size: 18px; margin-bottom: 15px;">---</div>
        <button id="addBtn" class="modal-btn">ADD TO QUEUE</button>
        <button id="discardBtn" class="cancel-btn">Discard</button>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const modal = document.getElementById("confirm-modal");
        const itemList = document.getElementById("item-list");
        const syncBtn = document.getElementById("syncAllBtn");
        const userNameInput = document.getElementById("userName");
        const userPhoneInput = document.getElementById("userPhone");
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyi0xyxkaMdHucaJO5Vmanbksn9vow7tn4K8vr_SpLKbrWY34NmuLwToaEobKmI0lJZFw/exec";

        let scanQueue = [];
        let isScanning = true;
        let pendingData = "";

        // Check if inputs are filled
        function validateSync() {
            const hasData = scanQueue.length > 0;
            const hasName = userNameInput.value.trim().length > 1;
            const hasPhone = userPhoneInput.value.trim().length > 4;
            syncBtn.disabled = !(hasData && hasName && hasPhone);
        }

        [userNameInput, userPhoneInput].forEach(el => el.oninput = validateSync);

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream; video.play(); requestAnimationFrame(tick);
        });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
                canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code) {
                    isScanning = false;
                    pendingData = code.data;
                    document.getElementById("modal-data").innerText = code.data;
                    modal.classList.add("show");
                }
            }
            requestAnimationFrame(tick);
        }

        document.getElementById("addBtn").onclick = () => {
            scanQueue.push(pendingData);
            updateUI();
            closeModal();
        };

        document.getElementById("discardBtn").onclick = closeModal;

        function updateUI() {
            document.getElementById("item-count").innerText = scanQueue.length;
            itemList.innerHTML = "";
            scanQueue.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "queue-item";
                div.innerHTML = `<span style="font-size:14px;">${item}</span><button class="remove-btn" onclick="removeItem(${index})">×</button>`;
                itemList.prepend(div);
            });
            validateSync();
        }

        window.removeItem = (index) => {
            scanQueue.splice(index, 1);
            updateUI();
        };

        syncBtn.onclick = async () => {
            const name = userNameInput.value;
            const phone = userPhoneInput.value;
            syncBtn.innerText = "SYNCING...";
            syncBtn.disabled = true;

            for (const data of scanQueue) {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: 'no-cors',
                    body: JSON.stringify({ qrData: data, playerName: name, playerPhone: phone })
                });
            }

            alert("Data synced successfully!");
            scanQueue = [];
            syncBtn.innerText = "CONFIRM & SYNC";
            updateUI();
        };

        function closeModal() { modal.classList.remove("show"); isScanning = true; pendingData = ""; }
    </script>
</body>
</html>
