<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Quest Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #1a1a1a; --accent: #00ccff; }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0; padding: 0; font-family: -apple-system, sans-serif; 
            background: var(--bg); color: white; 
            display: flex; flex-direction: column; 
            height: 100vh; height: -webkit-fill-available;
            overflow: hidden; 
        }

        /* Camera Section */
        #video-container { 
            position: relative; 
            flex: 1; 
            overflow: hidden; 
            background: #000;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }

        #reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 180px; height: 180px; border: 2px dashed rgba(0,255,136,0.5); border-radius: 20px;
            z-index: 2;
        }

        .name-input-container {
            position: absolute; top: 15px; width: 100%; text-align: center; z-index: 5;
        }
        #playerName {
            padding: 10px 15px; border-radius: 25px; border: 1px solid var(--primary);
            background: rgba(0,0,0,0.7); color: white; width: 70%; text-align: center; font-size: 16px;
        }

        /* History Section */
        #history-section { 
            height: 38vh; 
            background: #111; 
            display: flex; 
            flex-direction: column; 
            border-top: 2px solid var(--primary);
            z-index: 10;
        }

        #history-header { 
            padding: 12px 15px; background: #222; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333;
        }
        
        #history-header span { font-size: 12px; color: var(--primary); font-weight: bold; letter-spacing: 1px; }

        .clear-btn { 
            background: #ff4444; color: white; border: none; 
            padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold;
        }

        #history-list { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }

        .history-item { 
            background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; 
            border-left: 4px solid var(--accent); animation: slideIn 0.3s ease-out;
        }
        .history-time { font-size: 10px; color: #666; display: block; margin-bottom: 2px; }
        .history-data { font-size: 14px; font-weight: bold; word-break: break-all; color: #fff; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* Confirmation Modal */
        #confirm-modal {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: #222; padding: 25px; border-radius: 20px; border: 2px solid var(--primary);
            text-align: center; opacity: 0; visibility: hidden; transition: 0.2s; z-index: 100;
            width: 85%; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        #confirm-modal.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .btn-confirm { 
            background: var(--primary); color: #000; border: none; 
            padding: 16px; font-size: 16px; font-weight: bold; 
            border-radius: 30px; width: 100%; margin-top: 15px; 
        }
        .btn-cancel { background: transparent; color: #999; border: none; margin-top: 12px; font-size: 14px; width: 100%; }
    </style>
</head>
<body>

    <div id="video-container">
        <div class="name-input-container">
            <input type="text" id="playerName" placeholder="Enter Nickname">
        </div>
        <video id="video" playsinline></video>
        <div id="reticle"></div>
    </div>

    <div id="history-section">
        <div id="history-header">
            <span>ACTIVITY LOG (<span id="scan-count">0</span>)</span>
            <button class="clear-btn" id="clearBtn">CLEAR ALL</button>
        </div>
        <div id="history-list">
            </div>
    </div>

    <div id="confirm-modal">
        <div style="font-size: 12px; color: var(--primary); margin-bottom: 5px; letter-spacing: 1px;">QR DETECTED</div>
        <div id="display-data" style="font-weight: bold; font-size: 18px; margin-bottom: 15px; color: white;">---</div>
        <button id="sendBtn" class="btn-confirm">YES, SYNC DATA</button>
        <button id="cancelBtn" class="btn-cancel">Cancel / Scan Again</button>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const modal = document.getElementById("confirm-modal");
        const displayData = document.getElementById("display-data");
        const historyList = document.getElementById("history-list");
        const scanCountDisplay = document.getElementById("scan-count");
        
        // REPLACE THIS URL WITH YOUR GOOGLE WEB APP URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1DwYlilwRXSnMZliY1lPXv9FYR8rOPO_c3-aV10Yf8lEwxukry7AlOrBiDfXUBCX_bA/exec";

        let isScanning = true;
        let pendingData = "";
        let scanCount = 0;

        // Sound Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'found') {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Camera Access
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(tick);
            })
            .catch(err => alert("Camera error: " + err));

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    isScanning = false;
                    pendingData = code.data;
                    displayData.innerText = code.data;
                    modal.classList.add("show");
                    playBeep('found');
                }
            }
            requestAnimationFrame(tick);
        }

        document.getElementById("sendBtn").onclick = async () => {
            const name = document.getElementById("playerName").value || "Anonymous";
            const currentData = pendingData;
            
            // Add to UI immediately
            scanCount++;
            scanCountDisplay.innerText = scanCount;
            playBeep('sync');
            
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerHTML = `
                <span class="history-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                <span class="history-data">${currentData}</span>
            `;
            historyList.prepend(item);
            
            // Send to Google Sheet in background
            fetch(SCRIPT_URL, { 
                method: "POST", 
                mode: 'no-cors', 
                body: JSON.stringify({ qrData: currentData, playerName: name }) 
            });

            closeModal();
        };

        document.getElementById("cancelBtn").onclick = closeModal;

        document.getElementById("clearBtn").onclick = () => {
            if(confirm("Clear local logs?")) {
                historyList.innerHTML = "";
                scanCount = 0;
                scanCountDisplay.innerText = "0";
            }
        };

        function closeModal() {
            modal.classList.remove("show");
            isScanning = true;
            pendingData = "";
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
    </script>
</body>
</html>
