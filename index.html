<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
      body { background-color: #f4f7f6; padding: 20px; }
      .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 600px; margin: auto; }
      .section-title { font-size: 0.9rem; font-weight: bold; color: #6f42c1; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid #eee; }
      .blouse-only { display: none; background: #fdfbff; padding: 15px; border-radius: 8px; border-left: 4px solid #6f42c1; }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h4 class="text-center mb-4">Product Registration</h4>
      <form id="regForm" onsubmit="handleFormSubmit(this)">
        
        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Brand</label>
            <select class="form-select" name="brand" required>
              <option value="SWRKHI">SWRKHI</option>
              <option value="Saheli">Saheli</option>
            </select>
          </div>
          <div class="col">
            <label class="form-label">Category</label>
            <select class="form-select" name="category" id="categorySelect" onchange="toggleBlouseFields()" required>
              <option value="Dokhona">Dokhona</option>
              <option value="Fasra">Fasra</option>
              <option value="Aronai">Aronai</option>
              <option value="Blouse">Blouse</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Fabric Type</label>
          <input type="text" class="form-control" name="fabric" placeholder="e.g. Silk, Cotton, Eri" required>
        </div>
        
        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Color</label>
            <input type="text" class="form-control" name="color" required>
          </div>
          <div class="col">
            <label class="form-label">Design/Pattern</label>
            <input type="text" class="form-control" name="design" placeholder="e.g. Agor pattern" required>
          </div>
        </div>

        <div id="blouseFields" class="blouse-only mb-3">
          <p class="section-title">Blouse Customization Details</p>
          <div class="row mb-2">
            <div class="col"><input type="text" class="form-control" name="sleeveLength" placeholder="Sleeve Length"></div>
            <div class="col"><input type="text" class="form-control" name="size" placeholder="Size (e.g. 38)"></div>
          </div>
          <div class="row mb-2">
            <div class="col"><input type="text" class="form-control" name="frontCut" placeholder="Front Cut Style"></div>
            <div class="col"><input type="text" class="form-control" name="backCut" placeholder="Back Cut Style"></div>
          </div>
          <div class="form-check form-check-inline mt-2">
            <input class="form-check-input" type="checkbox" name="handwork" value="Yes">
            <label class="form-check-label">Handwork Included</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" name="lacework" value="Yes">
            <label class="form-check-label">Lace Work Included</label>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Tailor Name</label>
            <input type="text" class="form-control" name="tailorName">
          </div>
          <div class="col">
            <label class="form-label">Price (₹)</label>
            <input type="number" class="form-control" name="price" required>
          </div>
        </div>

        <button type="submit" class="btn btn-dark w-100 py-2" id="submitBtn">Generate QR & Save</button>
      </form>
    </div>

    <script>
      function toggleBlouseFields() {
        const category = document.getElementById('categorySelect').value;
        const blouseDiv = document.getElementById('blouseFields');
        blouseDiv.style.display = (category === 'Blouse') ? 'block' : 'none';
      }

      function handleFormSubmit(formObject) {
        event.preventDefault();
        google.script.run.withSuccessHandler(() => {
          alert("Product Registered Successfully!");
          document.getElementById('regForm').reset();
          toggleBlouseFields();
        }).processForm(formObject);
      }
    </script>
  </body>
</html>
