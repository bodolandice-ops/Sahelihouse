<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Quest - History Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #121212; --card: #1e1e1e; --accent: #00ccff; }
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: var(--bg); color: white; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }

        /* Camera Viewport (Top half) */
        #video-container { position: relative; flex: 1; overflow: hidden; border-bottom: 2px solid var(--primary); }
        #video { width: 100%; height: 100%; object-fit: cover; }

        /* History Section (Bottom half) */
        #history-section { height: 35vh; background: var(--bg); display: flex; flex-direction: column; }
        #history-header { padding: 10px; font-size: 14px; color: var(--primary); font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        #history-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; }
        .history-item { 
            background: var(--card); padding: 10px; border-radius: 8px; margin-bottom: 8px; 
            border-left: 4px solid var(--primary); animation: slideIn 0.3s ease-out;
        }
        .history-time { font-size: 10px; color: #888; display: block; }
        .history-data { font-size: 14px; font-weight: bold; }

        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Confirmation Modal */
        #confirm-modal {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: var(--card); padding: 25px; border-radius: 20px; border: 2px solid var(--accent);
            text-align: center; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); width: 80%; pointer-events: auto;
        }
        #confirm-modal.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .btn-confirm { background: var(--primary); color: #000; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 30px; margin-top: 15px; width: 100%; }
        .btn-cancel { background: transparent; color: #ff4444; border: none; margin-top: 10px; width: 100%; text-decoration: underline; }
        
        #reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150px; height: 150px; border: 2px dashed rgba(255,255,255,0.5); border-radius: 20px;
        }

        .name-overlay { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 5; }
        input { padding: 8px; border-radius: 20px; border: 1px solid var(--primary); background: rgba(0,0,0,0.7); color: white; text-align: center; width: 60%; }
    </style>
</head>
<body>

    <div id="video-container">
        <div class="name-overlay">
            <input type="text" id="playerName" placeholder="Enter Nickname">
        </div>
        <video id="video"></video>
        <div id="reticle"></div>
    </div>

    <div id="history-section">
        <div id="history-header">
            <span>ACTIVITY LOG</span>
            <span id="scan-count">Count: 0</span>
        </div>
        <div id="history-list">
            </div>
    </div>

    <div id="confirm-modal">
        <div style="font-size: 20px; margin-bottom: 5px;">📦 Item Found!</div>
        <div id="display-data" style="font-weight: bold; font-size: 18px; margin-bottom: 10px; color: var(--accent);">---</div>
        <button id="sendBtn" class="btn-confirm">CONFIRM & SYNC</button>
        <button id="cancelBtn" class="btn-cancel">Cancel</button>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const modal = document.getElementById("confirm-modal");
        const displayData = document.getElementById("display-data");
        const sendBtn = document.getElementById("sendBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const historyList = document.getElementById("history-list");
        const scanCountDisplay = document.getElementById("scan-count");
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwc5YMNQG9uZ8AoTRQ691lEmCGtDAKsd2pXvfrOXFZQon3dedOl74Y7pi-Ez-Hll00TcQ/exec";

        let isScanning = true;
        let pendingData = "";
        let scanCount = 0;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            requestAnimationFrame(tick);
        });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) showConfirmation(code.data);
            }
            requestAnimationFrame(tick);
        }

        function showConfirmation(data) {
            isScanning = false; 
            pendingData = data;
            displayData.innerText = data;
            modal.classList.add("show");
            if (navigator.vibrate) navigator.vibrate(100);
        }

        sendBtn.onclick = async () => {
            const name = document.getElementById("playerName").value || "Anonymous";
            const currentData = pendingData;
            
            // Add to Local UI History immediately
            addToHistory(currentData);
            
            // Send to Google
            try {
                fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: 'no-cors',
                    body: JSON.stringify({ qrData: currentData, playerName: name })
                });
            } catch (e) { console.log("Sync background error"); }

            resetScanner();
        };

        cancelBtn.onclick = resetScanner;

        function addToHistory(data) {
            scanCount++;
            scanCountDisplay.innerText = `Count: ${scanCount}`;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerHTML = `
                <span class="history-time">${time}</span>
                <span class="history-data">${data}</span>
            `;
            historyList.prepend(item); // Add to top of list
        }

        function resetScanner() {
            modal.classList.remove("show");
            pendingData = "";
            isScanning = true;
        }
    </script>
</body>
</html>
