<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Quest Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #1a1a1a; --accent: #00ccff; }
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: var(--bg); color: white; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }

        #video-container { position: relative; flex: 1; overflow: hidden; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }

        #history-section { height: 35vh; background: #111; display: flex; flex-direction: column; border-top: 2px solid var(--primary); }
        #history-header { 
            padding: 12px; font-size: 12px; color: var(--primary); font-weight: bold; 
            background: #1a1a1a; display: flex; justify-content: space-between; align-items: center;
        }
        
        .clear-btn { background: #ff4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }

        #history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { 
            background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; 
            border-left: 4px solid var(--accent); position: relative;
        }
        .history-time { font-size: 10px; color: #666; }
        .history-data { display: block; font-size: 14px; margin-top: 3px; }

        #confirm-modal {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: #222; padding: 25px; border-radius: 20px; border: 2px solid var(--primary);
            text-align: center; opacity: 0; visibility: hidden; transition: 0.2s; z-index: 100;
            width: 80%; pointer-events: auto;
        }
        #confirm-modal.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .btn-confirm { background: var(--primary); color: #000; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 30px; width: 100%; margin-top: 10px; }
        .btn-cancel { background: transparent; color: #999; border: none; margin-top: 10px; width: 100%; }
        
        #reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 180px; height: 180px; border: 2px solid rgba(0,255,136,0.3); border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="video"></video>
        <div id="reticle"></div>
    </div>

    <div id="history-section">
        <div id="history-header">
            <span>SCANS: <span id="scan-count">0</span></span>
            <button class="clear-btn" id="clearBtn">CLEAR ALL</button>
        </div>
        <div id="history-list"></div>
    </div>

    <div id="confirm-modal">
        <div id="display-data" style="font-weight: bold; font-size: 18px; margin-bottom: 15px;">---</div>
        <button id="sendBtn" class="btn-confirm">YES, SYNC DATA</button>
        <button id="cancelBtn" class="btn-cancel">Cancel</button>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const modal = document.getElementById("confirm-modal");
        const displayData = document.getElementById("display-data");
        const historyList = document.getElementById("history-list");
        const scanCountDisplay = document.getElementById("scan-count");
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1DwYlilwRXSnMZliY1lPXv9FYR8rOPO_c3-aV10Yf8lEwxukry7AlOrBiDfXUBCX_bA/exec";

        let isScanning = true;
        let pendingData = "";
        let scanCount = 0;

        // Audio Setup (Synthesized Beep)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if(type === 'found') {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if(type === 'sync') {
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream; video.setAttribute("playsinline", true); video.play();
            requestAnimationFrame(tick);
        });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
                canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code) {
                    isScanning = false; pendingData = code.data;
                    displayData.innerText = code.data;
                    modal.classList.add("show");
                    playBeep('found');
                }
            }
            requestAnimationFrame(tick);
        }

        document.getElementById("sendBtn").onclick = async () => {
            const currentData = pendingData;
            scanCount++;
            scanCountDisplay.innerText = scanCount;
            playBeep('sync');
            
            // Add to History UI
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerHTML = `<span class="history-time">${new Date().toLocaleTimeString()}</span><span class="history-data">${currentData}</span>`;
            historyList.prepend(item);
            
            // Background Sync
            fetch(SCRIPT_URL, { method: "POST", mode: 'no-cors', body: JSON.stringify({ qrData: currentData, playerName: "User" }) });
            resetScanner();
        };

        document.getElementById("clearBtn").onclick = () => {
            historyList.innerHTML = "";
            scanCount = 0;
            scanCountDisplay.innerText = "0";
        };

        document.getElementById("cancelBtn").onclick = resetScanner;

        function resetScanner() {
            modal.classList.remove("show");
            isScanning = true;
            if (audioCtx.state === 'suspended') audioCtx.resume(); // Unlock audio on interaction
        }
    </script>
</body>
</html>
