<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #121212; --card: #1e1e1e; }
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: var(--bg); color: white; overflow: hidden; 
        }

        /* Camera Viewport */
        #video { width: 100vw; height: 100vh; object-fit: cover; position: fixed; top: 0; left: 0; }

        /* UI Layers */
        .ui-layer { position: absolute; z-index: 10; width: 100%; pointer-events: none; }
        .top-ui { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); padding: 20px 0; text-align: center; }
        .bottom-ui { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 40px 0; text-align: center; }

        input { 
            pointer-events: auto; padding: 12px; border-radius: 25px; border: 1px solid var(--primary);
            background: rgba(0,0,0,0.5); color: white; width: 70%; text-align: center; font-size: 16px;
        }

        /* Target Reticle */
        #reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; border: 2px solid rgba(255,255,255,0.3);
            border-radius: 20px; transition: all 0.3s;
        }
        .active-scan { border-color: var(--primary) !important; box-shadow: 0 0 20px var(--primary); }

        /* Success Message Overlay */
        #success-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: var(--card); padding: 25px; border-radius: 15px; border: 2px solid var(--primary);
            text-align: center; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 80%;
        }
        #success-msg.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .data-label { color: var(--primary); font-size: 12px; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .data-value { font-weight: bold; font-size: 18px; word-break: break-all; }

        #status-pill {
            display: inline-block; padding: 5px 15px; border-radius: 20px;
            background: rgba(0,255,136,0.2); color: var(--primary); font-size: 12px; margin-top: 10px;
        }
    </style>
</head>
<body>

    <video id="video"></video>
    <canvas id="canvas" hidden></canvas>

    <div class="ui-layer top-ui">
        <input type="text" id="playerName" placeholder="Enter Player Name">
    </div>

    <div id="reticle"></div>

    <div class="ui-layer bottom-ui">
        <div id="status-pill">Position QR inside frame</div>
    </div>

    <div id="success-msg">
        <div style="font-size: 40px; margin-bottom: 10px;">✅</div>
        <h2 style="margin: 0 0 15px 0;">Scan Complete!</h2>
        <span class="data-label">Transmitted Data:</span>
        <div id="display-data" class="data-value">---</div>
        <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
        <span class="data-label">Updated to:</span>
        <div id="display-name" class="data-value">---</div>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const successPopup = document.getElementById("success-msg");
        const displayData = document.getElementById("display-data");
        const displayName = document.getElementById("display-name");
        const reticle = document.getElementById("reticle");
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeEZEyivwvc3NjN5MBPoOvCK4GWTQe368JtzNDVIUwv50LUPCdD-xIRGUu_jFCY-T8XA/exec";

        let isScanning = true;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            requestAnimationFrame(tick);
        });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    processDiscovery(code.data);
                }
            }
            requestAnimationFrame(tick);
        }

        async function processDiscovery(data) {
            isScanning = false; // Pause scanner
            reticle.classList.add("active-scan");
            
            const name = document.getElementById("playerName").value || "Anonymous Player";
            
            // Update UI with the data being sent
            displayData.innerText = data;
            displayName.innerText = name;
            successPopup.classList.add("show");

            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            try {
                // Send to Google Sheet
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: 'no-cors',
                    body: JSON.stringify({ qrData: data, playerName: name })
                });
            } catch (e) {
                console.error("Cloud Sync Error", e);
            }

            // Auto-hide message and resume scanning after 3 seconds
            setTimeout(() => {
                successPopup.classList.remove("show");
                reticle.classList.remove("active-scan");
                isScanning = true;
            }, 3000);
        }
    </script>
</body>
</html>
